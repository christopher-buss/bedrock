# Copy this file to `.github/workflows/` at the root of your own repository.
# Nested under `examples/`, GitHub never runs it.

name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per environment. Do not cancel a running deploy: it may
# be between provisioning ids and publishing the place.
concurrency:
  cancel-in-progress: false
  group: deploy-production

jobs:
  deploy:
    name: Deploy to Roblox
    environment: production
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: true` is the default and is fine: the commit-back
      # step clears the read-only credentials before it pushes with its own
      # token.
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: pnpm
          node-version: 24

      # Puts `rojo` on PATH from this project's `mise.toml`.
      - name: Setup Roblox toolchain
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: christopher-buss/bedrock/packages/actions/deploy@actions-v0.1.1
        with:
          api-key: ${{ secrets.BEDROCK_API_KEY }}
          app-client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          branch: main
          deploy-command: pnpm exec bedrock
          environment: production
          gist-token: ${{ secrets.BEDROCK_GIST_TOKEN }}
          # Must match `codegen.output` in bedrock.config.ts.
          paths: src/shared/assets

    timeout-minutes: 30
