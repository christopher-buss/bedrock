# Copy to `.github/workflows/` at the root of your own repository.

name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# Never cancel a running deploy: it may be between provisioning ids and
# publishing the place.
concurrency:
  cancel-in-progress: false
  group: deploy-production

jobs:
  deploy:
    name: Deploy to Roblox
    environment: production
    runs-on: ubuntu-latest
    steps:
      # The default `persist-credentials: true` is fine: the commit-back step
      # clears the read-only credentials before it pushes with its own token.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm first: setup-node reads it to locate the store for `cache`.
      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          cache: pnpm
          node-version: 24.22.2

      # Puts `rojo` on PATH from this project's `mise.toml`.
      - name: Setup Roblox toolchain
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          install: true

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy
        uses: christopher-buss/bedrock/packages/actions/deploy@f121cf989225692fed1acf5e36c54cb79412bbf7 # actions-v0.1.1
        with:
          api-key: ${{ secrets.BEDROCK_API_KEY }}
          app-client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          branch: main
          deploy-command: pnpm exec bedrock
          environment: production
          gist-token: ${{ secrets.BEDROCK_GIST_TOKEN }}
          # Must match `codegen.output` in bedrock.config.ts.
          paths: src/shared/assets
    timeout-minutes: 30
