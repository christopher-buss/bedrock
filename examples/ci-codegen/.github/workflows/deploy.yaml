# Copy this file to `.github/workflows/` at the root of your own repository.
# Nested under `examples/`, GitHub never runs it.

name: Deploy

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time per environment. Do not cancel a running deploy: it may
# be between provisioning ids and publishing the place.
concurrency:
  cancel-in-progress: false
  group: deploy-production

jobs:
  deploy:
    name: Deploy to Roblox
    environment: production
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: true` is the default and is fine: the commit-back
      # step clears the read-only credentials before it pushes with its own
      # token.
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          cache: pnpm
          node-version: 24

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Puts `rojo` on PATH from `mise.toml`.
      - name: Setup toolchain
        uses: jdx/mise-action@v3

      - name: Deploy
        uses: christopher-buss/bedrock/packages/actions/deploy@actions-v0.1.1
        with:
          api-key: ${{ secrets.BEDROCK_API_KEY }}
          app-client-id: ${{ secrets.DEPLOY_APP_CLIENT_ID }}
          app-private-key: ${{ secrets.DEPLOY_APP_PRIVATE_KEY }}
          branch: main
          deploy-command: pnpm exec bedrock
          environment: production
          gist-token: ${{ secrets.BEDROCK_GIST_TOKEN }}
          # Must match `codegen.output` in bedrock.config.ts.
          paths: src/shared/assets

    timeout-minutes: 30
