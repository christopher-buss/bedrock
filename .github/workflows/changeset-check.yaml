# Blocking change-intent gate (ADR-029). Fails a PR that changes a versioned
# package without recording an intent under .changeset/. The covered set is
# derived from native pnpm versioning settings, including private versioned
# packages. PRs that touch nothing versioned (docs, CI, the
# remaining private packages) pass without one. For a deliberately
# non-releasing change to a covered package, record an explicit decline:
# `pnpm change --bump none @bedrock-rbx/core`.
#
# This is hand-rolled because pnpm has no equivalent of
# `changeset status --since`: `pnpm change status` reports only the pending
# intents and the plan they produce, has no --since and no --json, and always
# exits 0. See ADR-029 § Consequences.

name: Changeset Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changeset:
    name: Require a changeset
    # The release bot's Version PR legitimately consumes every pending intent.
    # The workflow, job and branch names keep the "changeset" wording: they are
    # load-bearing for branch protection and the head-ref guards elsewhere.
    if: ${{ !startsWith(github.head_ref, 'changeset-release/') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Verify tested merge snapshot
        run: |
          set -euo pipefail
          base=$(git rev-parse HEAD^1)
          head=$(git rev-parse HEAD^2)
          test "$head" = "$EVENT_HEAD"
          test "$base" = "$(git rev-parse "origin/$BASE_REF")" || { echo "::error::Base advanced; rerun this check"; exit 1; }
          echo "CHECKOUT_BASE=$base" >> "$GITHUB_ENV"
          echo "CHECKOUT_HEAD=$head" >> "$GITHUB_ENV"
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_HEAD: ${{ github.event.pull_request.head.sha }}

      # `--filter "[base]"` deliberately omits the `...` dependents prefix: an
      # ocale-only change marks core as changed through the `workspace:*` edge,
      # and that cascade is applied automatically by `pnpm version -r`. Asking
      # for an intent to cover it would be a false failure.
      - name: Verify a change intent is present
        run: |
          set -euo pipefail
          changed=$(pnpm list -r --depth -1 --json --filter "[$CHECKOUT_BASE]" | jq -r '.[].name')
          # Only the intents this PR adds or modifies count. Intents already on
          # the base branch belong to earlier PRs and are waiting for the next
          # Version PR to consume them; letting one of those satisfy the gate
          # would let this PR ship with no changelog entry of its own.
          #
          # Both comparisons use the verified merge parent, matching pnpm.
          mapfile -t intents < <(
            git diff --name-only --diff-filter=AM "$CHECKOUT_BASE" HEAD -- .changeset \
              | grep -E '^\.changeset/[^/]+\.md$' \
              | grep -vxF '.changeset/README.md' || true
          )
          # Native pnpm versioned scope, including private versioned packages.
          scope=$(bun --conditions source packages/change-intents/cli/gate.ts --scope)
          test -n "$scope" || { echo "::error::Derived no versioned packages"; exit 1; }
          mapfile -t gated <<< "$scope"
          missing=""
          for pkg in "${gated[@]}"; do
            echo "$changed" | grep -qxF "$pkg" || continue
            covered=false
            for intent in "${intents[@]}"; do
              # Package names live in the YAML frontmatter. `sed` stops at its
              # closing `---` so a body line that happens to read like
              # `@bedrock-rbx/core: ...` cannot satisfy the gate — `pnpm version
              # -r` builds its plan from the frontmatter alone.
              if sed -n '2,/^---$/p' "$intent" | grep -qE "^\"?${pkg}\"?:"; then
                covered=true
                break
              fi
            done
            [ "$covered" = true ] || missing="$missing $pkg"
          done
          if [ -n "$missing" ]; then
            echo "::error::No change intent covers:$missing"
            echo "Record one with 'pnpm change', or decline a release with" \
                 "'pnpm change --bump none <package>'."
            exit 1
          fi
          echo "Every touched published package is covered by a change intent."
      - if: ${{ !cancelled() && github.event.pull_request.user.login == 'renovate[bot]' }}
        name: Validate Renovate change intent policy
        run: bun --conditions source packages/change-intents/cli/gate.ts
        env:
          GH_TOKEN: ${{ github.token }}
          INTENTS_MODE: ${{ vars.RENOVATE_INTENTS_MODE || 'shadow' }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          WRITER_LOGIN: ${{ vars.RENOVATE_INTENTS_WRITER_LOGIN }}
        continue-on-error: ${{ vars.RENOVATE_INTENTS_MODE != 'enforce' && vars.RENOVATE_INTENTS_MODE != 'write' }}
    timeout-minutes: 10
