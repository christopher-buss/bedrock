# Publishes the @bedrock-rbx/actions GitHub Actions for `uses:` consumption.
#
# The action's bundled dist (packages/actions/dist) is gitignored on main to
# keep the tree clean. This workflow bakes it onto a tag so consumers can pin
# `christopher-buss/bedrock/packages/actions@actions-v<x.y.z>`. Pre-1.0
# releases are pinned by exact tag; the `actions-v<major>` alias only becomes
# a stable contract at 1.0.
#
# Trigger: an `actions-v<major>.<minor>.<patch>` tag. release.yaml cuts that
# tag from the version `pnpm version -r` gave @bedrock-rbx/actions and
# dispatches this workflow against it; pushing such a tag by hand reaches the
# same place. The workflow bundles the action, commits the dist into a detached
# commit on top of the tagged commit, force-moves the tag plus its
# `actions-v<major>` alias onto it, and cuts the GitHub Release.
#
# Baking on a TAG (not a branch) is deliberate: the repo's `all` ruleset
# enforces required_signatures on every branch, so an unsigned dist commit
# could not land on a branch. Reached only through a tag ref, it is not subject
# to that branch rule. The tag scheme is disjoint from the published package
# tags (`@bedrock-rbx/core@x.y.z`).
name: Release actions

on:
  push:
    tags:
      - "actions-v*"

  # release.yaml cuts the tag with GITHUB_TOKEN, which does not fire the `push`
  # trigger above, so it dispatches this workflow against the new tag instead.
  # `github.ref_name` is that tag under either trigger. Dispatching against a
  # branch fails the tag-shape guard below, which is the intended outcome.
  workflow_dispatch:

# No workflow-level token: the write scope is granted only to the one job that
# force-moves the tag refs (see the job-level `permissions` below).
permissions: {}

# Every actions-vX.y.z release force-moves the shared `actions-vX` alias, so
# all releases must serialize; keying on the exact tag would let two same-major
# releases race and leave the alias on whichever finished last.
concurrency:
  group: release-actions
  cancel-in-progress: false

jobs:
  bake:
    name: Bundle and bake dist onto the tag
    permissions:
      # Required to commit the bundled dist and force-update the tag refs.
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - name: Bundle the action
        run: pnpm --filter @bedrock-rbx/actions bundle
        shell: bash

      - name: Bake dist and move tags
        run: |
          set -euo pipefail
          if [[ ! "${TAG}" =~ ^actions-v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expected tag actions-v<major>.<minor>.<patch>; got ${TAG}"
            exit 1
          fi
          major="${TAG%%.*}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Pin the deploy composite's inner commit-back ref to the exact tag
          # being baked, so every release resolves its own commit-back bundle
          # instead of whatever the moving alias points at (and pre-1.0, the
          # committed `actions-v1` placeholder does not exist at all).
          sed -i "s|uses: christopher-buss/bedrock/packages/actions@.*|uses: christopher-buss/bedrock/packages/actions@${TAG}|" packages/actions/deploy/action.yaml
          git add packages/actions/deploy/action.yaml
          git add --force packages/actions/dist
          git commit --message "build(actions): bundle dist for ${TAG}"
          git tag --force "${TAG}"
          git tag --force "${major}"
          # --atomic: a plain push updates as many refs as it can, so a
          # rejection on one of the two would leave the exact tag baked and the
          # major alias on the previous release. release.yaml reads the exact
          # tag to decide whether a bake is still pending, so that half-state
          # would look finished and the alias would stay stale until the next
          # release moved it. Either both refs move or neither does, and the
          # job fails loudly for the retry.
          git push --atomic --force origin "refs/tags/${TAG}" "refs/tags/${major}"
        env:
          TAG: ${{ github.ref_name }}
        shell: bash

      # `actions-v*` is what a consumer pins, but the Releases page lists only
      # the npm `v<x.y.z>` line, so the tag they depend on is visible nowhere
      # but the Tags page. Cut a release on the baked tag, after the force-move
      # above, so it names the commit that actually carries the dist.
      #
      # --latest=false holds the repo's "latest release" pointer on the npm
      # line. Left to itself the pointer would alternate between the two
      # schemes depending on which shipped last.
      #
      # Notes are this version's CHANGELOG.md section, which is the intent
      # prose `pnpm version -r` wrote. A release with no section (a first
      # release, or a bake of a hand-pushed tag) falls back to generated notes
      # rather than shipping the whole changelog.
      - name: Publish the GitHub Release
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            echo "Release ${TAG} already exists"
            exit 0
          fi
          notes=""
          if [ -f packages/actions/CHANGELOG.md ]; then
            notes=$(
              awk -v heading="## ${TAG#actions-v}" '
                $0 == heading { found = 1; next }
                /^## / { found = 0 }
                found
              ' packages/actions/CHANGELOG.md
            )
          fi
          if [ -n "$notes" ]; then
            gh release create "${TAG}" --latest=false --title "${TAG}" --notes "$notes"
          else
            gh release create "${TAG}" --latest=false --title "${TAG}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
