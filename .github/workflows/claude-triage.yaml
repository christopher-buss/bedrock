name: Claude Triage

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  triage:
    permissions:
      checks: read
      contents: read
      id-token: write
      issues: write
      pull-requests: write
      statuses: read

    if: >-
      github.event.sender.login != 'renovate[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.user.login != 'renovate[bot]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1

      - id: read-prompt
        name: Read triage prompt
        run: |
          {
            echo 'prompt<<EOF'
            cat .claude/prompts/triage-prompt.md
            echo 'EOF'
          } >> $GITHUB_OUTPUT

      - if: github.event_name == 'issues'
        name: Triage Issue
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          allowed_non_write_users: "*"
          claude_args: |
            --model haiku
            --allowedTools "Bash(gh label list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh search issues:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE NUMBER: ${{ github.event.issue.number }}

            ${{ steps.read-prompt.outputs.prompt }}

      - if: github.event_name == 'pull_request'
        name: Triage Pull Request
        uses: anthropics/claude-code-action@d70510b174a1244958df0b03166a54912811f3e6 # v1.0.264
        with:
          allowed_non_write_users: "*"
          claude_args: |
            --model haiku
            --allowedTools "Bash(gh label list:*),Bash(gh pr view:*),Bash(gh pr edit:*),Bash(gh pr diff:*)"
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            ${{ steps.read-prompt.outputs.prompt }}
    timeout-minutes: 5
