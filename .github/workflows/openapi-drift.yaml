name: OpenAPI Drift

on:
  schedule:
    # Weekly on Mondays at 06:00 UTC. Roblox does not ship spec
    # changes daily; a weekly cadence keeps the PR signal useful
    # without becoming noise.
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

jobs:
  refresh:
    name: Refresh vendored openapi spec
    runs-on: ubuntu-latest
    env:
      DRIFT_BRANCH: automation/refresh-openapi-spec
      DRIFT_LABEL: openapi-drift
      DRIFT_TITLE: "build(ocale): refresh vendored openapi spec"
      GH_TOKEN: ${{ github.token }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      # Pin to `main` so a `workflow_dispatch` from a feature branch
      # cannot accidentally use that branch's tip as the drift base.
      # The drift PR always targets `main`, so the base must be `main`.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      # Read before the refresh rewrites it, so a failure report can
      # link the upstream diff from the pinned commit to the latest.
      - id: pinned
        name: Read pinned upstream commit
        run: |
          set -euo pipefail
          sha="$(grep -m1 '^\*\*Pinned commit:\*\*' packages/open-cloud/vendor/README.md \
            | grep -oE '[0-9a-f]{40}' || true)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - id: refresh
        name: Fetch upstream spec
        run: |
          set -euo pipefail
          pnpm --filter @bedrock-rbx/ocale refresh-openapi 2>&1 \
            | tee "$RUNNER_TEMP/refresh.log"

      # A refresh failure happens on main before any drift PR exists,
      # so it is reported in one tracking issue. A later failure
      # rewrites that issue's body and comments, rather than opening
      # another. The job still fails.
      - if: failure() && steps.refresh.outcome == 'failure'
        name: Report refresh failure in an issue
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/refresh.log"
          body="$RUNNER_TEMP/drift-issue.md"
          pkg="packages/open-cloud"
          spec="content/en-us/reference/cloud/openapi.json"

          # Keep the error message, drop the stack trace and colours.
          clean="$(sed 's/\x1b\[[0-9;]*m//g' "$log")"
          error="$(awk '/^error: /{p=1} p && /^ +at /{exit} p' <<< "$clean")"
          if [ -z "$error" ]; then
            error="$(tail -n 40 <<< "$clean")"
          fi

          latest="$(gh api "repos/Roblox/creator-docs/commits?path=$spec&per_page=1" \
            --jq '.[0].sha' || true)"
          if [ -n "$PINNED_SHA" ] && [ -n "$latest" ]; then
            # The anchor opens the compare page at the spec file.
            anchor="diff-$(printf '%s' "$spec" | sha256sum | cut -d' ' -f1)"
            compare="https://github.com/Roblox/creator-docs/compare/$PINNED_SHA...$latest"
            upstream="[Upstream spec diff]($compare#$anchor) from the pinned commit to the latest."
          else
            upstream="The upstream diff link is not available for this run."
          fi

          {
            echo "The OpenAPI drift refresh failed: $RUN_URL"
            echo
            echo "## Error"
            echo
            echo '~~~text'
            echo "$error"
            echo '~~~'
            echo
            echo "## Upstream change"
            echo
            echo "$upstream"
            echo
            echo "## What to do"
            echo
            echo "If the error names obsolete patches, Roblox fixed those drifts upstream:"
            echo
            echo "1. In \`$pkg/scripts/apply-schema-patches.ts\`, remove the \`PATCHES\`"
            echo "   entry for each description listed above."
            echo "2. Remove its entry under \"Local drift patches\" in \`$pkg/vendor/README.md\`."
            echo "3. Run \`pnpm --filter @bedrock-rbx/ocale refresh-openapi\` and open a PR."
            echo
            echo "This issue is updated by each failed run and closed by the next green run."
          } > "$body"

          cat "$body" >> "$GITHUB_STEP_SUMMARY"

          # labels.yaml owns the label; this only covers a run before
          # that sync has created it.
          gh label create "$DRIFT_LABEL" --color d93f0b \
            --description "The scheduled OpenAPI drift run failed" 2> /dev/null || true

          issue="$(gh issue list --label "$DRIFT_LABEL" --state open \
            --json number --jq '.[0].number // empty')"
          if [ -n "$issue" ]; then
            gh issue edit "$issue" --body-file "$body"
            gh issue comment "$issue" --body "Failed again: $RUN_URL"
          else
            gh issue create \
              --title "OpenAPI drift refresh failed" \
              --label "$DRIFT_LABEL" \
              --assignee "$GITHUB_REPOSITORY_OWNER" \
              --body-file "$body"
          fi
        env:
          PINNED_SHA: ${{ steps.pinned.outputs.sha }}

      - id: diff
        name: Detect drift
        run: |
          if git diff --quiet HEAD -- packages/open-cloud/vendor/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # Reset the drift branch to the current commit before the API
      # commit lands. No new commits are introduced by this push, so
      # the "signed commits" ruleset has nothing to verify; the spec
      # diff lands in the next step as a GitHub-signed commit via the
      # GraphQL API.
      - if: steps.diff.outputs.changed == 'true'
        name: Reset drift branch ref to base
        run: git push --force origin "HEAD:refs/heads/$DRIFT_BRANCH"

      - if: steps.diff.outputs.changed == 'true'
        name: Commit refreshed spec via API
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          branch: ${{ env.DRIFT_BRANCH }}
          commit_message: ${{ env.DRIFT_TITLE }}
          file_pattern: packages/open-cloud/vendor
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Count open PRs only. `gh pr view <branch>` also resolves a
      # merged or closed PR for the same head branch, which would
      # hide drift forever after the first drift PR merged.
      - if: steps.diff.outputs.changed == 'true'
        name: Open drift PR if missing
        run: |
          set -euo pipefail
          open_prs="$(gh pr list --head "$DRIFT_BRANCH" --base main --state open \
            --json number --jq length)"
          if [ "$open_prs" -gt 0 ]; then
            echo "existing drift PR refreshed with latest spec"
          else
            gh pr create \
              --head "$DRIFT_BRANCH" \
              --base main \
              --title "$DRIFT_TITLE" \
              --body "$(cat <<EOF
          Automated refresh of the vendored Roblox OpenAPI spec.

          Auto-merge is enabled: once \`ci.yaml\` on this PR turns
          green, it will squash-merge into \`main\` without human
          intervention. Disable auto-merge on the PR if you want to
          review the diff manually before merging.

          ## What changed

          The upstream \`content/en-us/reference/cloud/openapi.json\` in
          [Roblox/creator-docs](https://github.com/Roblox/creator-docs) has
          diverged from our pinned copy. The diff in this PR is exactly
          what \`pnpm --filter @bedrock-rbx/ocale refresh-openapi\` produced
          against main.

          ## What to review

          - Scan the spec diff for breaking shape changes to any schema
            your integration tests exercise.
          - If CI on this PR fails, that is a real signal: a fixture or
            parser needs to catch up. Fix it in this same PR rather
            than merging known-broken spec.
          - Check the updated \`vendor/README.md\` pinned-commit SHA
            matches the latest upstream commit touching the spec file.

          ## When in doubt

          Close the PR to defer; the next scheduled run will reopen it.

          🤖 Generated by the \`openapi-drift\` workflow.
          EOF
          )"
          fi

      # PRs opened with GITHUB_TOKEN do not auto-trigger other
      # workflows, so dispatch ci.yaml explicitly against the drift
      # branch. The resulting check runs attach to the branch head
      # and show up on the PR, letting auto-merge wait on them.
      - if: steps.diff.outputs.changed == 'true'
        name: Trigger CI on the drift branch
        run: gh workflow run ci.yaml --ref "$DRIFT_BRANCH"

      # Non-fatal: if the repo does not have auto-merge enabled or
      # branch protection requires a check ci.yaml does not produce,
      # the PR still stands open for a human merge.
      - if: steps.diff.outputs.changed == 'true'
        name: Enable auto-merge on the drift PR
        run: |
          set -euo pipefail
          pr="$(gh pr list --head "$DRIFT_BRANCH" --base main --state open \
            --json number --jq '.[0].number')"
          gh pr merge "$pr" --auto --squash
        continue-on-error: true

      # Runs only when every step passed, so the refresh no longer
      # fails. The assignment keeps a `gh` failure fatal under `set -e`,
      # which a command substitution in the `for` list would not.
      - name: Close the drift failure issue
        run: |
          set -euo pipefail
          issues="$(gh issue list --label "$DRIFT_LABEL" --state open \
            --json number --jq '.[].number')"
          for issue in $issues; do
            gh issue close "$issue" --comment "Refresh passed: $RUN_URL"
          done
    timeout-minutes: 15
