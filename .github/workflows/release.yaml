# Release pipeline for the published packages (@bedrock-rbx/core,
# @bedrock-rbx/ocale). Driven by pnpm's native versioning (see ADR-029).
#
# Two modes, selected per push to main by whether unconsumed change intent
# files are present under .changeset/:
#
#   Version mode (intents pending): apply `pnpm version -r`, commit the
#   bump to the `changeset-release/main` branch as a GitHub-SIGNED commit via
#   the GraphQL API (the repo's `all` ruleset enforces required_signatures on
#   every branch, so an unsigned `git push` from a bot would be rejected),
#   then open/refresh the "Version Packages" PR and dispatch CI against the
#   bot branch (PRs authored by GITHUB_TOKEN do not auto-trigger workflows).
#   Mirrors openapi-drift.yaml.
#
#   Publish mode (no intents — i.e. a Version PR just merged): build and
#   `pnpm publish -r` to npm with provenance, tag each newly published
#   version alongside one `v<x.y.z>` tag for the release as a whole, push the
#   tags, cut `actions-v<x.y.z>` if the action's version moved, cut the GitHub
#   Release on that `v` tag, and dispatch release-actions.yaml and
#   website-release.yaml for the tags they build from (a GITHUB_TOKEN tag push
#   does not fire the `on: push: tags` trigger on its own).
#
# `pnpm version -r` never commits or tags — a recursive run can bump packages
# to different versions, so there is no single version to tag. Both are done
# explicitly below.
#
# Three tag schemes coexist and never overlap: `<pkg>@<x.y.z>` names an npm
# version, `v<x.y.z>` names a release, and `actions-v<x.y.z>` names a baked
# composite action. All three are cut here; release-actions.yaml then bakes the
# bundled dist onto the `actions-v` one.
#
# Auth is via OIDC trusted publishing (no npm token) — `id-token: write` lets
# pnpm exchange a short-lived token at publish time.
#
# External prerequisites (cannot be provisioned here):
#   - a Trusted Publisher configured on npmjs.com for each package, pointing at
#     this repo + release.yaml.
#   - repo setting "Allow GitHub Actions to create and approve pull requests".

name: Release

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: changeset-release/main
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      # An intent is any *.md directly under .changeset/ other than README.md.
      # `-maxdepth 1` keeps ledger.yaml and any nested directory out of it.
      - id: changesets
        name: Detect pending change intents
        run: |
          set -euo pipefail
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -n1)
          if [ -n "$pending" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Version mode -------------------------------------------------
      # --no-git-checks because the checkout is not what pnpm considers a clean
      # publish branch; the bump is committed by the signed-commit step below.
      - if: steps.changesets.outputs.pending == 'true'
        name: Apply version bump
        run: |
          pnpm version -r --no-git-checks
          pnpm install --lockfile-only

      # Resolved here rather than at `pnpm change` time, because the version a
      # symbol ships in is not known until the bump above is applied. `main`
      # keeps the placeholders, so a re-cut Version PR re-derives the tags.
      - if: steps.changesets.outputs.pending == 'true'
        name: Resolve @since placeholders
        run: bun scripts/resolve-since-tags.ts

      # Move the bot branch ref onto main's (already-signed) tip. No new
      # commit is introduced, so required_signatures has nothing to verify;
      # the bump lands in the next step as a GitHub-signed API commit.
      - if: steps.changesets.outputs.pending == 'true'
        name: Reset release branch to base
        run: git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - if: steps.changesets.outputs.pending == 'true'
        name: Commit version bump via API (signed)
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          commit_message: "ci: version packages"
          file_pattern: .changeset packages pnpm-lock.yaml
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.changesets.outputs.pending == 'true'
        name: Open or refresh the Version PR
        run: |
          set -euo pipefail
          # `gh pr view <branch>` resolves the most recent PR for the branch
          # in ANY state, so a previously merged Version PR would satisfy it
          # and suppress creation of the next one. Filter to open PRs only.
          if [ "$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq length)" -gt 0 ]; then
            echo "Version PR already open; refreshed with the latest bump."
          else
            gh pr create \
              --head "$RELEASE_BRANCH" \
              --base main \
              --title "ci: version packages" \
              --body "$(cat <<'EOF'
          Automated version bump from the accumulated change intents
          (ADR-029).

          Merging this PR applies the version + CHANGELOG changes to `main`;
          the next `Release` run on that merge publishes the packages to npm
          and pushes their git tags.

          Review the bumped versions and generated `CHANGELOG.md` entries.
          To hold a release, leave this PR open — it refreshes automatically
          as more intents land on `main`.

          🤖 Generated by the `release` workflow.
          EOF
          )"
          fi

      # PRs opened/updated with GITHUB_TOKEN do not auto-trigger workflows,
      # so dispatch CI explicitly against the bot branch (per openapi-drift).
      - if: steps.changesets.outputs.pending == 'true'
        name: Trigger CI on the release branch
        run: gh workflow run ci.yaml --ref "$RELEASE_BRANCH"

      # ---- Publish mode -------------------------------------------------
      # A placeholder that reaches npm is baked into that release's docs and
      # hovers for good. Nothing is bumped in publish mode, so any survivor has
      # no release to resolve to and the resolver exits non-zero.
      - if: steps.changesets.outputs.pending == 'false'
        name: Guard against unresolved @since placeholders
        run: bun scripts/resolve-since-tags.ts

      - if: steps.changesets.outputs.pending == 'false'
        name: Build
        run: pnpm build

      # No npm token: auth is via OIDC trusted publishing. Each package has a
      # trusted publisher configured on npmjs.com pointing at this repo +
      # workflow; `id-token: write` lets pnpm exchange an OIDC token at publish
      # time, and provenance is attached automatically.
      #
      # `pnpm publish -r` skips versions already on the registry, so a rerun
      # after a partial failure resumes rather than double-publishing.
      - if: steps.changesets.outputs.pending == 'false'
        name: Publish to npm
        run: pnpm publish -r --no-git-checks
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # `pnpm publish` does not tag. Recreate the `<name>@<version>` tags that
      # `changeset publish` used to push — website-release.yaml triggers off
      # the `@bedrock-rbx/core@*` glob (ADR-004).
      #
      # The tags are derived from the public workspace manifests, NOT from the
      # run's publish summary. A `pnpm publish -r` that exits 0 leaves every
      # public package's current version on the registry, whether this run put
      # it there or an earlier one did; the summary lists only what this run
      # published. After a partial failure the retry publishes the remaining
      # package alone, so a summary-derived tag step would never tag the
      # package the first attempt got out. Existing tags are skipped, which
      # makes the step a no-op on a push to main that releases nothing.
      - id: tags
        if: steps.changesets.outputs.pending == 'false'
        name: Tag the published versions
        run: |
          set -euo pipefail
          # Explicit, so the "already tagged?" test does not rest on whether
          # actions/checkout happened to fetch tags. A tag missed here would
          # re-dispatch the docs build on every later push to main.
          git fetch --tags --force origin
          core_tag=""
          version=""
          # Space-separated, which the push step splits back apart. No
          # package name or version carries a space.
          created_tags=""
          while read -r tag; do
            case "$tag" in
              "@bedrock-rbx/core@"*) version="${tag#@bedrock-rbx/core@}" ;;
            esac
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              echo "Tag $tag already exists"
            else
              git tag "$tag"
              echo "Tagged $tag"
              created_tags="$created_tags $tag"
              case "$tag" in
                "@bedrock-rbx/core@"*) core_tag="$tag" ;;
              esac
            fi
          done < <(
            pnpm list -r --depth -1 --json \
              | jq -r '.[] | select(.private | not) | "\(.name)@\(.version)"'
          )
          # The fixed group gives every published package one shared version,
          # so a single `v<x.y.z>` names the release as a whole. It carries the
          # GitHub Release; the per-package tags carry the npm versions.
          #
          # An empty version means the derivation above found no core package,
          # which would tag a bare `v` and name a release nothing published.
          if [ -z "$version" ]; then
            echo "::error::No @bedrock-rbx/core version among the public manifests"
            exit 1
          fi
          release_tag="v$version"
          if git rev-parse -q --verify "refs/tags/$release_tag" >/dev/null; then
            echo "Tag $release_tag already exists"
          else
            git tag "$release_tag"
            echo "Tagged $release_tag"
            created_tags="$created_tags $release_tag"
          fi
          # Whether the notes still have to be generated, asked of the releases
          # themselves rather than of the tag. A run whose tag push landed and
          # whose note generation then failed leaves the tag in place, so a tag
          # that already exists is no reason to skip: the version would keep
          # its tag and never get its release. Asking about the release makes
          # the retry work and still leaves a push to main that released
          # nothing with nothing to do.
          if gh release view "$release_tag" >/dev/null 2>&1; then
            echo "Release $release_tag already exists"
            release_tag=""
          fi
          # The release the notes are generated from. Excluding the tag being
          # released by name covers the retry, where that tag is already in the
          # list and would otherwise make the range empty. `actions-v*` does
          # not match the glob, which keeps that scheme out of it.
          previous_tag=$(
            git tag --list 'v[0-9]*' | grep -vFx "v$version" | sort -V | tail -n1 || true
          )
          echo "core_tag=$core_tag" >> "$GITHUB_OUTPUT"
          echo "created_tags=${created_tags# }" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

      # One ref per push: the repo's `all` ruleset refuses a push updating more
      # than three, and a release now cuts one tag per published package plus
      # the `v<x.y.z>`. Pushing them together was already at that ceiling with
      # three packages, and the fixed group takes another slot with every
      # first-party plugin that joins it.
      #
      # A tag created but not pushed does not survive the run (the next one
      # checks out fresh and re-derives from the manifests), so pushing only
      # what this run created loses no healing.
      - if: steps.changesets.outputs.pending == 'false' && steps.tags.outputs.created_tags != ''
        name: Push tags
        run: |
          set -euo pipefail
          read -ra tags <<< "$CREATED_TAGS"
          for tag in "${tags[@]}"; do
            git push origin "refs/tags/$tag"
          done
        env:
          CREATED_TAGS: ${{ steps.tags.outputs.created_tags }}

      # @bedrock-rbx/actions is private, so it has no npm tag among the ones
      # derived above, but it is versioned: `pnpm version -r` bumps it whenever
      # an intent names it. Cut `actions-v<x.y.z>` from that version, so the
      # tag a consumer pins comes out of the same release plan as everything
      # else instead of being typed by hand afterwards.
      #
      # Whether the bake still has to run is asked of the GitHub Release, not
      # of the tag, for the reason the `tags` step above gives: a run whose tag
      # push landed and whose bake then failed leaves a tag a consumer can pin
      # with no dist behind it, and a tag-keyed test would skip it forever.
      # Asking about the release makes the retry work and still leaves a
      # release no actions intent covered with nothing to do.
      - id: actions-tag
        if: steps.changesets.outputs.pending == 'false'
        name: Tag the actions release
        run: |
          set -euo pipefail
          version=$(jq -r .version packages/actions/package.json)
          tag="actions-v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "Tag $tag already exists"
          else
            git tag "$tag"
            git push origin "refs/tags/$tag"
            echo "Tagged $tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists"
          else
            echo "tag=$tag" >> "$GITHUB_OUTPUT"
          fi

      # A GITHUB_TOKEN tag push does not fire release-actions.yaml's
      # `on: push: tags` trigger — the same constraint the docs dispatch at the
      # end of this job works around. Dispatch it explicitly against the new
      # tag; `github.ref_name` resolves to that tag under either trigger, so the
      # bake reads the same value whichever way it was reached.
      - if: steps.changesets.outputs.pending == 'false' && steps.actions-tag.outputs.tag != ''
        name: Trigger the actions bake for the new tag
        run: gh workflow run release-actions.yaml --ref "$ACTIONS_TAG"
        env:
          ACTIONS_TAG: ${{ steps.actions-tag.outputs.tag }}

      # Notes come from the conventional commits in the range, not from the
      # committed CHANGELOG.md: the changelog carries the intent prose and
      # ships in the tarball, the release carries the PR and author attribution
      # ADR-029 gave up along with @changesets/changelog-github.
      #
      # changelogithub's default types are feat, fix and perf, which is the
      # set this repo treats as consumer-facing, and its default grouping nests
      # each commit under its scope, so one aggregate release reads per
      # package. The range is passed explicitly because the tag-scheme knobs
      # that would otherwise resolve it live only in a config file.
      #
      # Pinned to an exact version, as the actions above are pinned to a SHA:
      # `pnpm dlx` resolves and executes at run time, so a range would run
      # whatever the registry served that day. `pnpm dlx` has nowhere to put an
      # integrity hash, which makes the exact version the whole of the pin.
      #
      # Nothing here can cost a release: it runs after publish, a failure is
      # skipped, and a re-run generates the notes the next time round.
      - if: steps.changesets.outputs.pending == 'false' && steps.tags.outputs.release_tag != ''
        name: Create the GitHub Release
        run: |
          set -euo pipefail
          if [ -n "$PREVIOUS_TAG" ]; then
            pnpm dlx changelogithub@15.0.5 --from "$PREVIOUS_TAG" --to "$RELEASE_TAG"
          else
            pnpm dlx changelogithub@15.0.5 --to "$RELEASE_TAG"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PREVIOUS_TAG: ${{ steps.tags.outputs.previous_tag }}
          RELEASE_TAG: ${{ steps.tags.outputs.release_tag }}
        continue-on-error: true

      # The tag push above uses GITHUB_TOKEN and so will not fire
      # website-release.yaml's `on: push: tags` trigger. Dispatch it
      # explicitly against the new core tag for a tagged-source docs build.
      # Gated on the tag being new, so a push to main that released nothing
      # does not rebuild the docs off an already-released tag.
      - if: steps.changesets.outputs.pending == 'false' && steps.tags.outputs.core_tag != ''
        name: Trigger docs release for the core tag
        run: gh workflow run website-release.yaml --ref "$CORE_TAG"
        env:
          CORE_TAG: ${{ steps.tags.outputs.core_tag }}
    timeout-minutes: 15
