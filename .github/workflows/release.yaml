# Release pipeline for the published packages (@bedrock-rbx/core,
# @bedrock-rbx/ocale). Driven by pnpm's native versioning (see ADR-029).
#
# Two modes, selected per push to main by whether unconsumed change intent
# files are present under .changeset/:
#
#   Version mode (intents pending): apply `pnpm version -r`, commit the
#   bump to the `changeset-release/main` branch as a GitHub-SIGNED commit via
#   the GraphQL API (the repo's `all` ruleset enforces required_signatures on
#   every branch, so an unsigned `git push` from a bot would be rejected),
#   then open/refresh the "Version Packages" PR and dispatch CI against the
#   bot branch (PRs authored by GITHUB_TOKEN do not auto-trigger workflows).
#   Mirrors openapi-drift.yaml.
#
#   Publish mode (no intents — i.e. a Version PR just merged): build and
#   `pnpm publish -r` to npm with provenance, tag each newly published
#   version, push the tags, and dispatch website-release.yaml for the new
#   core tag (a GITHUB_TOKEN tag push does not fire the `on: push: tags`
#   trigger on its own).
#
# `pnpm version -r` never commits or tags — a recursive run can bump packages
# to different versions, so there is no single version to tag. Both are done
# explicitly below.
#
# Auth is via OIDC trusted publishing (no npm token) — `id-token: write` lets
# pnpm exchange a short-lived token at publish time.
#
# External prerequisites (cannot be provisioned here):
#   - a Trusted Publisher configured on npmjs.com for each package, pointing at
#     this repo + release.yaml.
#   - repo setting "Allow GitHub Actions to create and approve pull requests".

name: Release

on:
  push:
    branches: [main]

  workflow_dispatch:

permissions:
  actions: write
  contents: write
  id-token: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Version or publish
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_BRANCH: changeset-release/main
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup
        uses: ./.github/actions/setup

      # An intent is any *.md directly under .changeset/ other than README.md.
      # `-maxdepth 1` keeps ledger.yaml and any nested directory out of it.
      - id: changesets
        name: Detect pending change intents
        run: |
          set -euo pipefail
          pending=$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md' | head -n1)
          if [ -n "$pending" ]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            echo "pending=false" >> "$GITHUB_OUTPUT"
          fi

      # ---- Version mode -------------------------------------------------
      # --no-git-checks because the checkout is not what pnpm considers a clean
      # publish branch; the bump is committed by the signed-commit step below.
      - if: steps.changesets.outputs.pending == 'true'
        name: Apply version bump
        run: |
          pnpm version -r --no-git-checks
          pnpm install --lockfile-only

      # Move the bot branch ref onto main's (already-signed) tip. No new
      # commit is introduced, so required_signatures has nothing to verify;
      # the bump lands in the next step as a GitHub-signed API commit.
      - if: steps.changesets.outputs.pending == 'true'
        name: Reset release branch to base
        run: git push --force origin "HEAD:refs/heads/$RELEASE_BRANCH"

      - if: steps.changesets.outputs.pending == 'true'
        name: Commit version bump via API (signed)
        uses: planetscale/ghcommit-action@a6b150b81dca5dd027baa898604418eec9e11465 # v0.2.22
        with:
          branch: ${{ env.RELEASE_BRANCH }}
          commit_message: "ci: version packages"
          file_pattern: .changeset packages pnpm-lock.yaml
          repo: ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.changesets.outputs.pending == 'true'
        name: Open or refresh the Version PR
        run: |
          set -euo pipefail
          # `gh pr view <branch>` resolves the most recent PR for the branch
          # in ANY state, so a previously merged Version PR would satisfy it
          # and suppress creation of the next one. Filter to open PRs only.
          if [ "$(gh pr list --head "$RELEASE_BRANCH" --state open --json number --jq length)" -gt 0 ]; then
            echo "Version PR already open; refreshed with the latest bump."
          else
            gh pr create \
              --head "$RELEASE_BRANCH" \
              --base main \
              --title "ci: version packages" \
              --body "$(cat <<'EOF'
          Automated version bump from the accumulated change intents
          (ADR-029).

          Merging this PR applies the version + CHANGELOG changes to `main`;
          the next `Release` run on that merge publishes the packages to npm
          and pushes their git tags.

          Review the bumped versions and generated `CHANGELOG.md` entries.
          To hold a release, leave this PR open — it refreshes automatically
          as more intents land on `main`.

          🤖 Generated by the `release` workflow.
          EOF
          )"
          fi

      # PRs opened/updated with GITHUB_TOKEN do not auto-trigger workflows,
      # so dispatch CI explicitly against the bot branch (per openapi-drift).
      - if: steps.changesets.outputs.pending == 'true'
        name: Trigger CI on the release branch
        run: gh workflow run ci.yaml --ref "$RELEASE_BRANCH"

      # ---- Publish mode -------------------------------------------------
      - if: steps.changesets.outputs.pending == 'false'
        name: Build
        run: pnpm build

      # No npm token: auth is via OIDC trusted publishing. Each package has a
      # trusted publisher configured on npmjs.com pointing at this repo +
      # workflow; `id-token: write` lets pnpm exchange an OIDC token at publish
      # time, and provenance is attached automatically.
      #
      # `pnpm publish -r` skips versions already on the registry, so a rerun
      # after a partial failure resumes rather than double-publishing.
      # --report-summary writes pnpm-publish-summary.json, which is the
      # machine-readable list of what actually went out this run.
      - id: publish
        if: steps.changesets.outputs.pending == 'false'
        name: Publish to npm
        run: |
          set -euo pipefail
          rm -f pnpm-publish-summary.json
          pnpm publish -r --report-summary --no-git-checks
          count=$(jq '.publishedPackages | length' pnpm-publish-summary.json)
          if [ "$count" -gt 0 ]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          NPM_CONFIG_PROVENANCE: "true"

      # `pnpm publish` does not tag. Recreate the `<name>@<version>` tags that
      # `changeset publish` used to push — website-release.yaml triggers off
      # the `@bedrock-rbx/core@*` glob (ADR-004).
      - if: steps.changesets.outputs.pending == 'false' && steps.publish.outputs.published == 'true'
        name: Tag the published versions
        run: |
          set -euo pipefail
          jq -r '.publishedPackages[] | "\(.name)@\(.version)"' pnpm-publish-summary.json \
            | while read -r tag; do
                if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                  echo "Tag $tag already exists"
                else
                  git tag "$tag"
                  echo "Tagged $tag"
                fi
              done

      - if: steps.changesets.outputs.pending == 'false' && steps.publish.outputs.published == 'true'
        name: Push tags
        run: git push origin --tags

      # The tag push above uses GITHUB_TOKEN and so will not fire
      # website-release.yaml's `on: push: tags` trigger. Dispatch it
      # explicitly against the new core tag for a tagged-source docs build.
      - if: steps.changesets.outputs.pending == 'false' && steps.publish.outputs.published == 'true'
        name: Trigger docs release for the core tag
        run: |
          set -euo pipefail
          # The `bedrock` package directory is the `@bedrock-rbx/core` package.
          version=$(node -p "require('./packages/bedrock/package.json').version")
          tag="@bedrock-rbx/core@${version}"
          if git ls-remote --tags origin "refs/tags/$tag" | grep -q "$tag"; then
            gh workflow run website-release.yaml --ref "$tag"
          fi
    timeout-minutes: 15
