name: CI

on:
  merge_group:

  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Test the release smoke gate without publishing
        run: bash .github/scripts/test-release-gate.sh

      - name: Setup
        uses: ./.github/actions/setup

      - name: Cache ESLint
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: eslint-${{ runner.os }}-${{ hashFiles('**/pnpm-lock.yaml', 'eslint.config.*') }}
          path: .eslintcache
          restore-keys: eslint-${{ runner.os }}-

      - name: Run hk check
        run: hk check --all

      - name: Check Luau config types
        run: pnpm --filter @bedrock-rbx/core test:luau-types

      - if: always()
        name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage/
          retention-days: 7

      - if: failure()
        name: Upload build artifacts on failure
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-artifacts
          path: |
            packages/*/dist/
            apps/*/dist/
            **/*.log
          retention-days: 7
    timeout-minutes: 15

  mutation:
    name: Mutation Test
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup
        uses: ./.github/actions/setup

      - id: stryker-hash
        name: Hash Stryker config inputs
        run: echo "hash=${{ hashFiles('packages/testing/src/stryker.ts', 'packages/*/stryker.config.ts', 'packages/*/tsconfig.json', 'pnpm-lock.yaml') }}" >> "$GITHUB_OUTPUT"

      - id: stryker-cache
        name: Restore Stryker incremental cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: stryker-${{ runner.os }}-${{ steps.stryker-hash.outputs.hash }}-${{ github.head_ref || github.ref_name }}-${{ github.sha }}
          path: |
            packages/*/reports/stryker-incremental.json
          restore-keys: |
            stryker-${{ runner.os }}-${{ steps.stryker-hash.outputs.hash }}-${{ github.head_ref || github.ref_name }}-
            stryker-${{ runner.os }}-${{ steps.stryker-hash.outputs.hash }}-main-

      # Config-loader tests import package exports from temporary consumer files.
      # Those imports need the default dist exports even when Vitest uses source.
      - name: Build packages
        run: pnpm build

      - name: Mutation test changed files
        run: pnpm mutate:changed
        env:
          MUTATE_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}
          VITEST_TYPECHECK: "false"

      - if: always() && steps.stryker-cache.outputs.cache-hit != 'true'
        name: Save Stryker incremental cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: ${{ steps.stryker-cache.outputs.cache-primary-key }}
          path: |
            packages/*/reports/stryker-incremental.json
    timeout-minutes: 30
