# Native pnpm release management (ADR-029). Intent files still live in
# .changeset/ in the changesets format; only the tooling changed.
versioning:
  # Defaults to `registry`, which commits no CHANGELOG.md and instead composes
  # sections into the tarball at publish time. We keep committed changelogs.
  changelog:
    storage: repository

  # core, ocale and the first-party plugins share one version number. pnpm
  # has no `linked` equivalent, so a change to any of them releases all.
  fixed:
    - ["@bedrock-rbx/core", "@bedrock-rbx/ocale", "@bedrock-rbx/state-s3"]

  # pnpm only auto-excludes private packages that carry no `version` field.
  # All of ours have one, so the private packages are listed explicitly —
  # otherwise apps/e2e and apps/website would be versioned and changelogged
  # for depending on a released package.
  #
  # @bedrock-rbx/actions is the exception: private, so `pnpm publish -r` skips
  # it, but absent from this list so `pnpm change` can record intents against
  # it and `pnpm version -r` bumps it and writes its CHANGELOG.md. It is not in
  # the fixed group and depends on no released package, so it enters a release
  # plan only when it carries an intent of its own. That keeps the action's
  # version line independent of core's cadence; the version it lands on is what
  # release.yaml cuts the `actions-v<x.y.z>` tag from.
  ignore:
    - "@bedrock-rbx/e2e"
    - "@bedrock-rbx/testing"
    - "@bedrock-rbx/typescript-config"
    - "@bedrock-rbx/vite-config"
    - "@bedrock-rbx/website"

  # Pre-1.0: `major` would jump straight to 1.0.0. Enforced on the assembled
  # release plan, so it also caps propagated bumps. Remove this deliberately
  # for the 1.0.0 release.
  maxBump: minor
